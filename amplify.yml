version: 1
frontend:
  phases:
    preBuild:
      commands:
        - curl -fsSL https://bun.sh/install | bash
        - export PATH="$HOME/.bun/bin:$PATH"
        - source /root/.bashrc || true
        - bun install
        - echo "I am running on $BUILD_ENV"
    build:
      commands:
        - export PATH="$HOME/.bun/bin:$PATH"
        - bun run build:$BUILD_ENV
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
